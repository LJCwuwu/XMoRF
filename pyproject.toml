[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmorf"
version = "1.0.0rc1"
description = "Nested prediction of molecular recognition feature cores and regions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.5.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
features = ["transformers>=4.45,<6", "sentencepiece>=0.2,<1", "safetensors>=0.4,<1"]

[project.scripts]
xmorf-predict = "xmorf.predict:main"

[project.urls]
Repository = "https://github.com/LJCwuwu/XMoRF"

[tool.setuptools.packages.find]
where = ["src"]
